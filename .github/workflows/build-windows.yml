name: Build MCLauncher for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # install-qt-action creates the Qt subdirectory below this prefix.
          dir: '${{ github.workspace }}'
          archives: qtbase
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Bundle Qt runtime
        shell: pwsh
        run: >-
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe"
          --release
          --compiler-runtime
          --no-translations
          "$env:GITHUB_WORKSPACE/build/Release/MCLauncher.exe"

      - name: Add documentation
        shell: pwsh
        run: |
          Copy-Item README.md build/Release/README.md
          Copy-Item LICENSE build/Release/LICENSE

      - name: Package portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/* -DestinationPath MCLauncher-windows-x64.zip -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLauncher-windows-x64
          path: MCLauncher-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MCLauncher-windows-x64.zip
          generate_release_notes: true
