<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCLauncher — web preview</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080d16;
            --bg-soft: #0d1421;
            --sidebar: #0b111d;
            --panel: #111b2b;
            --panel-strong: #142238;
            --panel-hover: #192a42;
            --line: #22334a;
            --line-soft: rgba(132, 164, 205, .13);
            --text: #edf4ff;
            --muted: #8ea2be;
            --faint: #5f7391;
            --blue: #64a7ff;
            --blue-strong: #3f86ed;
            --cyan: #53d6d2;
            --green: #72d39b;
            --amber: #eabb72;
            --red: #ed818e;
            --shadow: 0 20px 70px rgba(0, 0, 0, .28);
            --radius: 16px;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background:
                radial-gradient(900px 600px at 78% -10%, rgba(54, 113, 193, .16), transparent 65%),
                radial-gradient(640px 520px at 16% 100%, rgba(38, 116, 126, .09), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            letter-spacing: .005em;
        }
        body::before {
            content: "";
            position: fixed;
            z-index: 0;
            inset: -25%;
            pointer-events: none;
            opacity: .72;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(78, 177, 218, .13), transparent 34%),
                radial-gradient(ellipse at 80% 35%, rgba(116, 102, 224, .12), transparent 32%),
                radial-gradient(ellipse at 52% 86%, rgba(70, 198, 164, .1), transparent 30%);
            filter: blur(18px);
            transform: translate3d(0, 0, 0) scale(1);
            animation: backgroundDrift 22s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: fixed;
            z-index: 0;
            inset: 0;
            pointer-events: none;
            opacity: .22;
            background-image: linear-gradient(rgba(133, 170, 214, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(133, 170, 214, .035) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
            animation: gridFloat 18s linear infinite;
        }
        @keyframes backgroundDrift {
            0% { transform: translate3d(-3%, -2%, 0) scale(1); }
            50% { transform: translate3d(3%, 2%, 0) scale(1.08); }
            100% { transform: translate3d(-1%, 4%, 0) scale(1.02); }
        }
        @keyframes gridFloat {
            from { background-position: 0 0, 0 0; }
            to { background-position: 42px 42px, -42px 21px; }
        }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
        .icon.fill { fill: currentColor; stroke: none; }

        .app-shell { min-height: 100vh; display: flex; position: relative; z-index: 1; }
        .ambient-field { position: fixed; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
        .ambient-orb { position: absolute; width: 250px; height: 250px; border-radius: 50%; filter: blur(26px); opacity: .18; mix-blend-mode: screen; }
        .orb-a { left: 20%; top: 18%; background: #4eabff; animation: orbA 19s ease-in-out infinite alternate; }
        .orb-b { right: 10%; top: 58%; width: 330px; height: 330px; background: #6a62dd; animation: orbB 25s ease-in-out infinite alternate; }
        .orb-c { left: 38%; bottom: -130px; width: 300px; height: 300px; background: #44d4b2; animation: orbC 23s ease-in-out infinite alternate; }
        .ambient-star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #c9e8ff; box-shadow: 0 0 13px 3px rgba(140, 211, 255, .35); opacity: .5; }
        .star-a { left: 34%; top: 24%; animation: twinkle 3.8s ease-in-out infinite; }
        .star-b { right: 24%; top: 16%; animation: twinkle 4.7s 1s ease-in-out infinite; }
        .star-c { left: 72%; bottom: 22%; animation: twinkle 5.1s 2s ease-in-out infinite; }
        @keyframes orbA { from { transform: translate3d(-50px, -25px, 0) scale(.85); } to { transform: translate3d(80px, 60px, 0) scale(1.2); } }
        @keyframes orbB { from { transform: translate3d(55px, -45px, 0) scale(1); } to { transform: translate3d(-75px, 50px, 0) scale(.78); } }
        @keyframes orbC { from { transform: translate3d(-70px, 35px, 0) scale(.8); } to { transform: translate3d(90px, -80px, 0) scale(1.13); } }
        @keyframes twinkle { 0%, 100% { opacity: .18; transform: scale(.6); } 50% { opacity: .85; transform: scale(1.45); } }

        .sidebar {
            width: 252px;
            min-height: 100vh;
            padding: 22px 14px 16px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(15, 24, 39, .97), rgba(8, 13, 22, .98));
            border-right: 1px solid var(--line-soft);
            position: sticky;
            top: 0;
            align-self: flex-start;
        }
        .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 25px; }
        .brand-mark {
            width: 35px; height: 35px; border-radius: 10px; display: grid; place-items: center;
            color: #07111a; background: linear-gradient(145deg, #85e7da, #4a9df5);
            background-size: 170% 170%;
            box-shadow: 0 8px 22px rgba(71, 157, 238, .22);
            font-weight: 900; font-size: 16px;
            animation: markFloat 4.8s ease-in-out infinite, markGradient 7s ease infinite;
        }
        .brand strong { display: block; font-size: 15px; letter-spacing: .02em; }
        .brand span { display: block; margin-top: 2px; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; }
        .section-label { padding: 0 12px 8px; color: #5f7696; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .nav { display: grid; gap: 4px; }
        .nav button {
            position: relative; overflow: hidden;
            border: 0; color: var(--muted); background: transparent; border-radius: 10px; width: 100%; padding: 11px 12px;
            display: flex; align-items: center; gap: 12px; text-align: left; transition: color .18s ease, background .18s ease, transform .18s ease;
        }
        .nav button:after { content: ""; position: absolute; left: -40%; top: 0; width: 28%; height: 100%; transform: skewX(-18deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.11), transparent); opacity: 0; }
        .nav button:hover { color: var(--text); background: rgba(100, 167, 255, .08); transform: translateX(3px); }
        .nav button:hover:after { opacity: 1; animation: navShine .7s ease forwards; }
        .nav button.active { color: #e9f4ff; background: linear-gradient(90deg, rgba(75, 139, 229, .2), rgba(74, 135, 220, .07)); box-shadow: inset 3px 0 0 var(--blue); }
        .nav button.active:before { content: ""; position: absolute; left: 0; top: 14%; bottom: 14%; width: 3px; border-radius: 4px; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); animation: activeBar 2.5s ease-in-out infinite; }
        .nav button .icon { transition: transform .22s ease, color .22s ease; }
        .nav button:hover .icon { transform: translateX(2px) rotate(-4deg); }
        .nav button.active .icon { color: var(--blue); transform: scale(1.08); }
        .nav .nav-badge { margin-left: auto; color: var(--cyan); font-size: 11px; font-weight: 700; }
        .side-spacer { flex: 1; }
        .side-card { border: 1px solid var(--line-soft); background: rgba(20, 33, 53, .64); border-radius: 13px; padding: 13px; margin: 17px 4px 12px; }
        .side-card-row { display: flex; align-items: center; gap: 9px; }
        .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 4px rgba(114, 211, 155, .1); }
        .side-card strong { font-size: 12px; }
        .side-card p { margin: 8px 0 0; color: var(--faint); font-size: 11px; line-height: 1.45; }
        .side-footer { color: #536681; text-align: center; font-size: 10px; line-height: 1.55; }

        .main { min-width: 0; flex: 1; }
        .topbar { height: 74px; padding: 0 34px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line-soft); background: rgba(8, 13, 22, .46); backdrop-filter: blur(14px); }
        .crumbs { display: flex; align-items: center; gap: 9px; color: var(--faint); font-size: 12px; }
        .crumbs strong { color: var(--text); font-size: 13px; font-weight: 650; }
        .crumb-separator { color: #3d526d; }
        .top-actions { display: flex; align-items: center; gap: 16px; }
        .preview-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(83, 214, 210, .24); color: var(--cyan); background: rgba(83, 214, 210, .07); padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .preview-chip .status-dot { width: 6px; height: 6px; box-shadow: none; }
        .account-mini { display: flex; gap: 9px; align-items: center; padding-left: 16px; border-left: 1px solid var(--line-soft); }
        .avatar { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg, #6e89ff, #a67bea); color: white; font-weight: 800; font-size: 12px; }
        .account-mini .account-name { font-size: 12px; font-weight: 650; }
        .account-mini .account-role { color: var(--faint); font-size: 10px; margin-top: 2px; }
        .mobile-menu { display: none; }

        .page { max-width: 1440px; margin: 0 auto; padding: 34px 34px 56px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
        .eyebrow { color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 9px; }
        h1, h2, h3, p { margin-top: 0; }
        h1 { margin-bottom: 8px; font-size: clamp(26px, 3vw, 38px); letter-spacing: -.04em; line-height: 1.05; }
        h2 { margin-bottom: 6px; font-size: 21px; letter-spacing: -.025em; }
        h3 { margin-bottom: 4px; font-size: 14px; }
        .subtle { color: var(--muted); line-height: 1.55; }
        .small { color: var(--faint); font-size: 12px; }
        .page-head .subtle { margin: 0; max-width: 620px; font-size: 13px; }
        .page-actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }

        .btn {
            position: relative; overflow: hidden;
            border: 1px solid var(--line); color: #dceaff; background: #17263c; border-radius: 9px; padding: 10px 14px;
            display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: border-color .17s ease, background .17s ease, transform .17s ease, box-shadow .17s ease; white-space: nowrap;
        }
        .btn:after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.09) 48%, transparent 75%); background-size: 220% 100%; background-position: 150% 0; pointer-events: none; }
        .btn:hover:after { background-position: -50% 0; transition: background-position .65s ease; }
        .btn.primary { background-size: 180% 180%; animation: primaryGlow 6s ease-in-out infinite; }
        .btn:hover { border-color: #476488; background: #1e334f; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn.primary { color: #06111d; border-color: #6ab6f7; background: linear-gradient(135deg, #80e0d0, #66aaff, #80e0d0); background-size: 220% 220%; box-shadow: 0 9px 24px rgba(79, 164, 231, .2); font-weight: 800; animation: primaryGlow 6s ease-in-out infinite; }
        .btn.primary:hover { border-color: #9cece0; background: linear-gradient(135deg, #9ae8dc, #82baff, #9ae8dc); background-size: 220% 220%; }
        .btn.ghost { background: transparent; }
        .btn.danger { color: #ffb5bc; border-color: rgba(237, 129, 142, .28); background: rgba(237, 129, 142, .06); }
        .btn.compact { padding: 7px 10px; font-size: 12px; }
        .btn .icon { width: 16px; height: 16px; }
        .btn[disabled] { opacity: .55; pointer-events: none; }
        button[data-action], button[data-view] { position: relative; overflow: hidden; }

        .grid { display: grid; gap: 18px; }
        .grid.two { grid-template-columns: minmax(0, 1.45fr) minmax(280px, .8fr); }
        .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .panel { border: 1px solid var(--line-soft); background: linear-gradient(145deg, rgba(19, 31, 50, .96), rgba(14, 23, 38, .96)); border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease; }
        .panel:hover { transform: translateY(-2px); border-color: rgba(100, 167, 255, .22); box-shadow: 0 24px 80px rgba(0, 0, 0, .34); }
        .panel.pad { padding: 19px; }
        .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
        .panel-head h2, .panel-head h3 { margin-bottom: 0; }
        .panel-head .small { margin-top: 4px; }
        .rule { height: 1px; background: var(--line-soft); margin: 17px 0; }
        .muted-icon { color: #66809f; }
        .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 8px; font-size: 10px; font-weight: 750; letter-spacing: .01em; }
        .pill.blue { background: rgba(100, 167, 255, .12); color: #91c4ff; }
        .pill.green { background: rgba(114, 211, 155, .11); color: #8be4af; }
        .pill.amber { background: rgba(234, 187, 114, .12); color: #f0c983; }
        .pill.gray { background: rgba(142, 162, 190, .1); color: #9fb3cd; }

        /* Play */
        .hero { overflow: hidden; position: relative; min-height: 292px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); background: linear-gradient(113deg, #162a42 0%, #14233a 47%, #152c3a 100%); border-color: rgba(99, 164, 234, .22); }
        .hero:before { content: ""; position: absolute; width: 560px; height: 560px; right: -190px; top: -240px; border-radius: 50%; background: radial-gradient(circle, rgba(96, 212, 190, .22), transparent 66%); }
        .hero:after { content: ""; position: absolute; inset: 0; opacity: .22; background-image: linear-gradient(135deg, transparent 0 47%, rgba(128, 201, 224, .12) 47% 48%, transparent 48% 100%), linear-gradient(45deg, transparent 0 63%, rgba(128, 201, 224, .09) 63% 64%, transparent 64% 100%); pointer-events: none; }
        .hero-main { z-index: 1; padding: 30px 32px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
        .hero-kicker { color: #94b5d8; font-size: 11px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
        .hero-title { display: flex; align-items: center; gap: 15px; margin: 24px 0 20px; }
        .cube-logo { width: 62px; height: 62px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 17px; color: #07151d; font-size: 22px; font-weight: 950; background: linear-gradient(145deg, #91eed4 0 45%, #5eacef 46% 100%); box-shadow: 10px 13px 25px rgba(3, 12, 20, .24); transform: rotate(-5deg); }
        .hero h2 { margin: 0; font-size: 30px; letter-spacing: -.045em; }
        .hero-version { margin-top: 5px; color: #9fb9d5; font-size: 13px; }
        .hero-bottom { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .play-btn { min-width: 145px; padding: 13px 19px; font-size: 14px; }
        .hero-detail { display: flex; align-items: center; gap: 7px; color: #9cb5d1; font-size: 11px; }
        .hero-detail .icon { color: var(--cyan); width: 15px; height: 15px; }
        .hero-side { z-index: 1; padding: 25px 25px 25px 10px; display: flex; align-items: flex-end; }
        .hero-side-card { width: 100%; border: 1px solid rgba(170, 211, 241, .17); border-radius: 13px; padding: 16px; background: rgba(7, 14, 25, .28); backdrop-filter: blur(5px); }
        .hero-side-card .side-card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; color: #b9cde4; font-size: 11px; font-weight: 700; }
        .disk-bar { height: 5px; border-radius: 9px; background: rgba(211, 232, 250, .12); overflow: hidden; margin: 9px 0 8px; }
        .disk-bar span { display: block; height: 100%; width: 34%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--blue)); }
        .disk-label { display: flex; justify-content: space-between; color: #86a3c0; font-size: 10px; }
        .stats { margin: 18px 0; }
        .stat { padding: 16px 18px; }
        .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--faint); font-size: 11px; }
        .stat-number { margin-top: 9px; color: #f4f8ff; font-size: 26px; font-weight: 720; letter-spacing: -.04em; }
        .stat-note { color: var(--green); font-size: 10px; margin-top: 4px; }
        .stat .icon { color: var(--blue); }
        .instance-list { display: grid; gap: 6px; }
        .instance-item { border: 1px solid transparent; display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 11px; background: rgba(10, 18, 30, .3); transition: .16s ease; text-align: left; color: var(--text); }
        .instance-item:hover { background: var(--panel-hover); border-color: var(--line); }
        .instance-item.active { border-color: rgba(100, 167, 255, .34); background: rgba(70, 125, 206, .12); }
        .instance-icon { width: 29px; height: 29px; border-radius: 8px; display: grid; place-items: center; color: #071522; background: linear-gradient(145deg, #93e4d5, #76aef7); font-size: 11px; font-weight: 900; }
        .instance-item:nth-child(2n) .instance-icon { background: linear-gradient(145deg, #d5b6fc, #7ca9f7); }
        .instance-item:nth-child(3n) .instance-icon { background: linear-gradient(145deg, #f4cf9c, #e990a4); }
        .instance-copy { min-width: 0; flex: 1; }
        .instance-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
        .instance-copy span { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }
        .instance-status { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
        .settings-list { display: grid; gap: 14px; }
        .setting-line { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .setting-label { color: var(--muted); font-size: 12px; }
        .setting-value { color: #e4edfb; font-size: 12px; font-weight: 650; text-align: right; }
        .select { color: #e5efff; background: #0d1726; border: 1px solid #2c405d; border-radius: 8px; padding: 8px 30px 8px 10px; outline: none; }
        .select:focus, .input:focus { border-color: #6599d6; box-shadow: 0 0 0 3px rgba(100, 167, 255, .1); }
        .loader-tabs { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
        .loader-tab { color: var(--muted); border: 1px solid var(--line); background: #0d1726; border-radius: 7px; padding: 6px 8px; font-size: 10px; }
        .loader-tab.active { color: #bce6ff; border-color: rgba(100, 167, 255, .55); background: rgba(100, 167, 255, .13); }
        .toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; cursor: pointer; }
        .toggle input { display: none; }
        .toggle-track { width: 32px; height: 18px; padding: 2px; border-radius: 999px; background: #28384f; transition: .18s; }
        .toggle-track:after { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #9eacc0; transition: .18s; }
        .toggle input:checked + .toggle-track { background: #3f9eaf; }
        .toggle input:checked + .toggle-track:after { transform: translateX(14px); background: white; }
        .progress-wrap { margin-top: 17px; }
        .progress-head { display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; }
        .progress { height: 7px; background: #0b1320; border-radius: 8px; overflow: hidden; margin-top: 8px; }
        .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
        .activity-list { display: grid; gap: 2px; }
        .activity { display: flex; gap: 11px; align-items: flex-start; padding: 10px 3px; }
        .activity-icon { width: 27px; height: 27px; flex: 0 0 auto; border-radius: 8px; display: grid; place-items: center; color: var(--cyan); background: rgba(83, 214, 210, .09); }
        .activity-icon .icon { width: 14px; height: 14px; }
        .activity strong { display: block; color: #d8e5f6; font-size: 12px; font-weight: 600; }
        .activity span { display: block; color: var(--faint); font-size: 10px; margin-top: 3px; }

        /* Generic pages */
        .search-row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
        .input { width: 100%; min-width: 0; color: var(--text); background: #0b1422; border: 1px solid #2a3e59; border-radius: 9px; padding: 10px 12px; outline: none; }
        .search-input { flex: 1; min-width: 220px; }
        .segmented { display: inline-flex; padding: 3px; border-radius: 9px; background: #0a1321; border: 1px solid var(--line-soft); }
        .segmented button { color: var(--faint); border: 0; background: transparent; border-radius: 6px; padding: 7px 10px; font-size: 11px; }
        .segmented button.active { color: #d9ecff; background: #243b5a; }
        .table-list { display: grid; gap: 7px; }
        .table-row { display: grid; grid-template-columns: minmax(160px, 1.5fr) minmax(110px, .8fr) minmax(100px, .7fr) auto; align-items: center; gap: 12px; border: 1px solid transparent; border-radius: 11px; padding: 12px 13px; background: rgba(8, 15, 27, .34); }
        .table-row:hover { border-color: var(--line); background: rgba(30, 49, 77, .42); }
        .table-row.selected { border-color: rgba(100, 167, 255, .35); background: rgba(70, 125, 206, .11); }
        .row-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .row-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
        .row-title .icon-box { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 8px; color: var(--blue); background: rgba(100, 167, 255, .1); }
        .row-meta { color: var(--muted); font-size: 11px; }
        .row-meta em { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; font-style: normal; }
        .empty { padding: 35px 15px; color: var(--faint); text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

        }
        function renderMods() {
            const query = state.modQuery.trim().toLowerCase();
            const visible = state.mods.filter(mod => (!query || `${mod.name} ${mod.description}`.toLowerCase().includes(query)) && (state.provider === 'Все' || mod.source === state.provider));
            return `<div class="page"><div class="page-head"><div><div class="eyebrow">Workspace / Mods</div><h1>Моды</h1><p class="subtle">Поиск и установка из Modrinth и CurseForge для инстанса «${esc(currentInstance().name)}».</p></div><button class="btn" data-action="open-mods-folder">${icon('folder')}Открыть папку mods</button></div><section class="panel pad">${panelHeader('Каталог модов', 'Демонстрационные результаты поиска. В desktop-версии здесь работают официальные API.', `<span class="pill green">${icon('check')}${state.mods.filter(m => m.installed).length} установлено</span>`)}<div class="search-row"><div class="search-input" style="position:relative"><span style="position:absolute;left:12px;top:10px;color:#607897">${icon('search')}</span><input class="input" id="mod-search" value="${esc(state.modQuery)}" placeholder="Найти Sodium, minimap, Create…" style="padding-left:38px"></div><div class="segmented">${['Modrinth','CurseForge','Все'].map(provider => `<button class="${state.provider === provider ? 'active' : ''}" data-action="set-provider" data-provider="${provider}">${provider}</button>`).join('')}</div><button class="btn primary" data-action="search-mods">${icon('search')}Найти</button></div><div class="rule"></div>${visible.length ? `<div class="card-grid">${visible.map(mod => `<article class="mod-card"><div class="mod-cover ${mod.color}"><div class="mod-glyph">${esc(mod.glyph)}</div><span class="pill ${mod.source === 'CurseForge' ? 'amber' : 'blue'}">${esc(mod.source)}</span></div><h3>${esc(mod.name)}</h3><p>${esc(mod.description)}</p><div class="mod-bottom"><span class="mod-meta">${esc(mod.version)} · ${esc(mod.downloads)} загрузок</span><button class="btn compact ${mod.installed ? 'ghost' : 'primary'}" data-action="install-mod" data-name="${esc(mod.name)}">${mod.installed ? icon('check') + 'Установлен' : icon('download') + 'Установить'}</button></div></article>`).join('')}</div>` : `<div class="empty">По запросу ничего не найдено. Попробуйте другой фильтр.</div>`}</section></div>`;
        }
        function renderServers() {
            const server = currentServer();
            return `<div class="page"><div class="page-head"><div><div class="eyebrow">Workspace / Servers</div><h1>Серверы</h1><p class="subtle">Адресная книга, быстрый выбор и запуск сразу на нужном сервере.</p></div><div class="page-actions"><button class="btn ghost" data-action="refresh-servers">${icon('refresh')}Проверить статусы</button><button class="btn primary" data-action="add-server">${icon('plus')}Добавить сервер</button></div></div><div class="server-layout"><section class="panel pad">${panelHeader('Адресная книга', `${state.servers.length} сохранённых адресов`, `<span class="pill green"><i class="status-dot"></i> 4 online</span>`)}<div class="server-list">${state.servers.map((item, index) => `<button class="server-item ${index === state.selectedServer ? 'selected' : ''}" data-action="select-server" data-index="${index}"><div class="server-favicon">${esc(item.letter)}</div><div class="server-copy"><strong>${esc(item.name)}</strong><span>${esc(item.address)}:${item.port}</span></div><span class="server-online">${item.players === 'offline' ? 'offline' : 'online'}</span></button>`).join('')}</div></section><section class="panel pad">${panelHeader('Сведения о сервере', 'Данные из локальной записи адресной книги.', `<button class="btn compact ghost" data-action="delete-server">${icon('trash')}Удалить</button>`)}<div class="detail-hero"><div class="detail-title"><div><h2>${esc(server.name)}</h2><span class="pill ${server.players === 'offline' ? 'gray' : 'green'}">${server.players === 'offline' ? 'offline' : 'online'}</span></div><div class="server-favicon" style="width:47px;height:47px;font-size:17px">${esc(server.letter)}</div></div><div class="address">${esc(server.address)}:${server.port}<button class="btn compact ghost" style="margin-left:9px;vertical-align:middle" data-action="copy-address">${icon('copy')}Копировать</button></div><div class="detail-stats"><div class="detail-stat"><span>Игроки</span><strong>${esc(server.players)}</strong></div><div class="detail-stat"><span>Пинг</span><strong>${esc(server.latency)}</strong></div><div class="detail-stat"><span>Версия</span><strong>${esc(server.version)}</strong></div></div></div><div class="rule"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><strong style="font-size:13px">Быстрое подключение</strong><div class="small" style="margin-top:5px">Подставить этот адрес в конфигурацию запуска.</div></div><button class="btn primary" data-action="use-server">${icon('play')}Использовать и играть</button></div><div class="rule"></div><div class="small">В полной desktop-версии здесь также доступны ping/favicon и проверка доступности через сеть.</div></section></div></div>`;
        }
        function renderNews() {
            return `<div class="page"><div class="page-head"><div><div class="eyebrow">Workspace / News</div><h1>Новости Minecraft</h1><p class="subtle">Официальная лента Mojang, сохранённая локально для быстрого просмотра.</p></div><button class="btn" data-action="refresh-news">${icon('refresh')}Обновить ленту</button></div><div class="news-grid">${state.news.map(item => `<article class="news-card"><div class="news-image ${item.color}"><span class="pill blue">${esc(item.tag)}</span><strong>MC</strong></div><div class="news-body"><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p><div class="news-footer"><span>${esc(item.date)}</span><button class="btn compact ghost" data-action="open-news">Читать ${icon('external')}</button></div></div></article>`).join('')}</div><section class="panel pad" style="margin-top:18px">${panelHeader('Источник и кэш')}<div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px">${icon('shield')}Лента загружается с официального источника Mojang и кэшируется локально при недоступной сети.<span class="pill green" style="margin-left:auto">кэш актуален</span></div></section></div>`;
        }
        function renderDiagnostics() {
            const report = currentReport();
            return `<div class="page"><div class="page-head"><div><div class="eyebrow">Workspace / Diagnostics</div><h1>Диагностика</h1><p class="subtle">Локальные crash reports и JVM fatal logs выбранного инстанса. Данные никуда не отправляются.</p></div><div class="page-actions"><button class="btn ghost" data-action="refresh-reports">${icon('refresh')}Обновить отчёты</button><button class="btn" data-action="open-reports">${icon('folder')}Открыть папку</button></div></div><div class="diagnostics-layout"><section class="panel pad">${panelHeader('Локальные отчёты', `${state.reports.length} файла в crash-reports`, `<span class="pill amber">требуют внимания</span>`)}<div class="report-list">${state.reports.map((item, index) => `<button class="report-item ${index === state.selectedReport ? 'selected' : ''}" data-action="select-report" data-index="${index}"><strong>${esc(item.file)}</strong><span>${esc(item.time)} · ${esc(item.type)}</span></button>`).join('')}</div></section><section class="panel pad report-viewer"><div class="report-toolbar"><div><strong>${esc(report.file)}</strong><div class="small" style="margin-top:4px">${esc(report.type)} · только чтение</div></div><button class="btn compact ghost" data-action="copy-report">${icon('copy')}Копировать</button></div><pre class="code-view">${esc(report.content)}</pre></section></div></div>`;
        }
        function renderAccount() {
            return `<div class="page"><div class="page-head"><div><div class="eyebrow">Profile / Account</div><h1>Аккаунт</h1><p class="subtle">Официальная авторизация Microsoft для Minecraft Java Edition и управление скином.</p></div>${state.loggedIn ? `<button class="btn danger" data-action="logout">Выйти</button>` : `<button class="btn primary" data-action="login">${icon('user')}Войти через Microsoft</button>`}</div><div class="account-grid"><section class="panel pad">${panelHeader('Microsoft account')}${state.loggedIn ? `<div class="account-banner"><div class="large-avatar">АМ</div><div><h2>Алексей Морозов</h2><p>Java Edition profile · авторизация подтверждена</p></div><span class="pill green" style="margin-left:auto">${icon('check')}выполнен вход</span></div><div class="rule"></div><div class="form-grid"><div class="setting-line"><span class="setting-label">Игровой профиль</span><span class="setting-value">Aleksei_M</span></div><div class="setting-line"><span class="setting-label">Способ входа</span><span class="setting-value">Microsoft OAuth · Device Code</span></div><div class="setting-line"><span class="setting-label">Лицензия</span><span class="pill green">Minecraft Java Edition</span></div></div>` : `<div class="empty" style="padding:48px 20px">${icon('shield')}<strong style="display:block;margin:12px 0 6px;color:#d9e8fa">Вход ещё не выполнен</strong><span>В веб-просмотре кнопка имитирует успешную авторизацию. В desktop-лаунчере используется настоящий Microsoft OAuth без обхода лицензии.</span><div style="margin-top:17px"><button class="btn primary" data-action="login">Войти в демо-профиль</button></div></div>`}</section><section class="panel pad">${panelHeader('Скин Minecraft', 'PNG 64×64 или 64×32')}${state.loggedIn ? `<div class="skin-drop" id="skin-drop"><div>${icon('upload')}<strong>Перетащите PNG сюда</strong><span>или выберите файл на компьютере</span><div style="margin-top:14px"><button class="btn compact" data-action="choose-skin">Выбрать PNG</button></div></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><span class="small">Модель</span><select class="select"><option>Classic / Steve</option><option>Slim / Alex</option></select></div><button class="btn primary" style="width:100%;margin-top:14px" data-action="upload-skin">${icon('upload')}Загрузить скин</button>` : `<div class="empty" style="padding:50px 20px">Войдите, чтобы управлять скином</div>`}</section></div><section class="panel pad" style="margin-top:18px">${panelHeader('Безопасность')}<div class="small" style="display:flex;gap:9px;align-items:flex-start">${icon('shield')}Access token и refresh token в desktop-версии хранятся через защищённое хранилище Windows. В web preview сетевые и OAuth-операции намеренно не выполняются.</div></section></div>`;
        }
        function render() {
            renderNav();
            renderAccountMini();
            const views = { play: renderPlay, instances: renderInstances, mods: renderMods, servers: renderServers, news: renderNews, diagnostics: renderDiagnostics, account: renderAccount };
            document.getElementById('app').innerHTML = (views[state.view] || renderPlay)();
        }

        document.addEventListener('click', (event) => {
            const nav = event.target.closest('[data-view]');
            if (nav) { state.view = nav.dataset.view; render(); return; }
            const actionElement = event.target.closest('[data-action]');
            if (!actionElement) return;
            const action = actionElement.dataset.action;
            if (action === 'launch') {
                if (state.launchState === 'launching') return;
                state.launchState = 'launching'; render(); toast('Запускаем Minecraft Java Edition…');
                setTimeout(() => { state.launchState = 'ready'; state.activities.unshift({ icon: 'play', title: `Запущен ${currentInstance().name}`, meta: 'Minecraft Java Edition · только что' }); render(); toast('Minecraft запущен в режиме предпросмотра', 'success'); }, 1800);
            } else if (action === 'verify') {
                state.installing = true; render(); toast('Проверяем клиентские файлы…');
                setTimeout(() => { state.installing = false; render(); toast('Проверка завершена: ошибок не найдено', 'success'); }, 1500);
            } else if (action === 'refresh' || action === 'refresh-servers' || action === 'refresh-news' || action === 'refresh-reports') {
                toast('Данные обновлены в режиме предпросмотра', 'success');
            } else if (action === 'select-instance') {
                state.activeInstance = Number(actionElement.dataset.index); const instance = currentInstance(); state.selectedVersion = instance.version; state.loader = instance.loader; render(); toast(`Выбран инстанс «${instance.name}»`);
            } else if (action === 'view-instances') { state.view = 'instances'; render(); }
            else if (action === 'create-instance') {
                const name = prompt('Название нового инстанса:', 'Новый профиль');
                if (name && name.trim()) { state.instances.push({ name: name.trim(), version: '1.21.8', loader: 'Vanilla', mods: 0, disk: '0.0 GB', updated: 'только что' }); state.activeInstance = state.instances.length - 1; render(); toast(`Создан инстанс «${name.trim()}»`, 'success'); }
            } else if (action === 'edit-instance') {
                const index = Number(actionElement.dataset.index); const name = prompt('Новое название:', state.instances[index].name);
                if (name && name.trim()) { state.instances[index].name = name.trim(); render(); toast('Название инстанса обновлено', 'success'); }
            } else if (action === 'set-loader') { state.loader = actionElement.dataset.loader; currentInstance().loader = state.loader; render(); toast(`Загрузчик: ${state.loader}`); }
            else if (action === 'set-provider') { state.provider = actionElement.dataset.provider; render(); }
            else if (action === 'search-mods') { state.modQuery = document.getElementById('mod-search')?.value || ''; render(); toast(`Поиск завершён: ${state.provider}`); }
            else if (action === 'install-mod') { const mod = state.mods.find(item => item.name === actionElement.dataset.name); if (mod) { mod.installed = !mod.installed; render(); toast(mod.installed ? `${mod.name} добавлен в mods` : `${mod.name} удалён из демонстрационного профиля`, mod.installed ? 'success' : ''); } }
            else if (action === 'open-mods-folder') { toast('В web preview папка mods недоступна — откройте desktop-версию'); }
            else if (action === 'select-server') { state.selectedServer = Number(actionElement.dataset.index); render(); }
            else if (action === 'use-server') { state.quickConnect = true; state.view = 'play'; render(); toast(`Сервер «${currentServer().name}» выбран для быстрого подключения`, 'success'); }
            else if (action === 'add-server') {
                const name = prompt('Название сервера:', 'Новый сервер'); if (!name || !name.trim()) return;
                const address = prompt('Адрес:', 'play.example.net'); if (!address || !address.trim()) return;
                const port = Number(prompt('Порт:', '25565')) || 25565;
                state.servers.push({ name: name.trim(), address: address.trim(), port: Math.max(1, Math.min(65535, port)), players: '—', latency: 'не проверен', version: 'неизвестно', letter: name.trim()[0].toUpperCase() }); state.selectedServer = state.servers.length - 1; render(); toast('Сервер добавлен в адресную книгу', 'success');
            } else if (action === 'delete-server') {
                if (state.servers.length <= 1) { toast('Нельзя удалить единственный сервер', 'error'); return; }
                if (confirm(`Удалить «${currentServer().name}» из адресной книги?`)) { state.servers.splice(state.selectedServer, 1); state.selectedServer = Math.max(0, state.selectedServer - 1); render(); toast('Сервер удалён'); }
            } else if (action === 'copy-address') { navigator.clipboard?.writeText(`${currentServer().address}:${currentServer().port}`); toast('Адрес скопирован в буфер обмена', 'success'); }
            else if (action === 'open-news') { toast('Открытие официальной статьи — доступно в desktop-версии'); }
            else if (action === 'select-report') { state.selectedReport = Number(actionElement.dataset.index); render(); }
            else if (action === 'copy-report') { navigator.clipboard?.writeText(currentReport().content); toast('Отчёт скопирован', 'success'); }
            else if (action === 'open-reports') { toast('Папка crash-reports доступна в desktop-версии'); }
            else if (action === 'login') { state.loggedIn = true; render(); toast('Демо-вход Microsoft выполнен', 'success'); }
            else if (action === 'logout') { state.loggedIn = false; render(); toast('Демо-сессия завершена'); }
            else if (action === 'choose-skin') { document.getElementById('skin-file').click(); }
            else if (action === 'upload-skin') { toast('В preview загрузка скина имитирована', 'success'); }
            else if (action === 'settings') { toast('Настройки desktop-версии доступны в Qt-приложении'); }
            else if (action === 'backup') { toast('Экспорт профиля сымитирован', 'success'); }
        });

        document.addEventListener('change', (event) => {
            if (event.target.id === 'version-select') { state.selectedVersion = event.target.value; currentInstance().version = state.selectedVersion; render(); toast(`Версия изменена на ${state.selectedVersion}`); }
            if (event.target.id === 'quick-toggle') { state.quickConnect = event.target.checked; toast(state.quickConnect ? 'Быстрое подключение включено' : 'Быстрое подключение выключено'); }
            if (event.target.id === 'memory-range') { state.memory = Number(event.target.value); render(); }
            if (event.target.id === 'skin-file' && event.target.files?.[0]) { toast(`Выбран файл ${event.target.files[0].name}`, 'success'); }
        });

        render();
    </script>
</body>
</html>
